<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="Images/logo.png" type="image/png">
  <title>題矣</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/interface.css">
<link rel="stylesheet" href="styles/notebook.css">
<link rel="stylesheet" href="styles/dialogs.css">
<link rel="stylesheet" href="styles/select-menu.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">

</head>

<body>
  <!-- 開始畫面 -->
  <div class="start-screen">


    <div class="top-right-controls">
      <button id="controlsMenuBtn" class="avatar-button" aria-haspopup="true" aria-expanded="false">
        <img id="controlsAvatar" src="Images/logo.png" alt="Profile" width="40" height="40">
      </button>
      <div id="controlsMenu" class="controls-menu" role="menu" aria-hidden="true">
        <div class="controls-menu-header">
          <div class="menu-avatar-wrapper">
            <img id="menuAvatar" class="menu-avatar" src="Images/logo.png" alt="Avatar" width="48" height="48">
          </div>
          <div class="menu-user-info">
            <div id="menuDisplayName" class="menu-name">尚未登入</div>
            <div id="menuEmail" class="menu-email">尚未登入</div>
          </div>
        </div>
        <div class="controls-divider"></div>
        <div class="controls-items-group">
          <button class="controls-item" id="menuArchived" role="menuitem">
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
              <path
                d="M480-480ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm120-120h320v-80H320v80Zm0-120h320v-80H320v80Zm0-120h320v-80H320v80Z" />
            </svg>
            <span class="item-label">典藏庫</span>
          </button>
          <button class="controls-item" id="menuStarred" role="menuitem">
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
              <path
                d="m354-287 126-76 126 77-33-144 111-96-146-13-58-136-58 135-146 13 111 97-33 143ZM233-120l65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Zm247-350Z" />
            </svg>
            <span class="item-label">已收藏</span>
          </button>
          <button class="controls-item" id="menuGlobalMistakes" role="menuitem">
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20"
              fill="currentColor">
              <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
            </svg>
            <span class="item-label">錯題本</span>
          </button>
          <button class="controls-item" id="menuShuffle" role="menuitem">
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
              <path
                d="M560-160v-80h104L537-367l57-57 126 126v-102h80v240H560Zm-344 0-56-56 504-504H560v-80h240v240h-80v-104L216-160Zm151-447L160-814l56-56 207 207-56 56Z" />
            </svg>
            <span class="item-label">隨機順序</span>
          </button>
          <button class="controls-item" id="menuTheme" role="menuitem">
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
              <path
                d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q52 0 98.5-24.5T836-533q2 13 3 26.5t1 27.5q0 150-105 255T480-120Zm0-80q88 0 158-48.5T740-375q-20 5-40 8t-40 3q-123 0-209.5-86.5T364-660q0-20 3-40t8-40q-78 32-126.5 102T200-480q0 116 82 198t198 82Zm-10-270Z" />
            </svg>
            <span class="item-label">深色模式</span>
          </button>
          <button class="controls-item" id="menuAddQuiz" role="menuitem">
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
              <path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z" />
            </svg>
            <span class="item-label">新增題庫</span>
          </button>
          <button class="controls-item" id="menuEditQuizName" role="menuitem">
            <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
              <path
                d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
            </svg>
            <span class="item-label">編輯題庫</span>
          </button>
        </div>
        <div class="controls-divider"></div>
        <button class="controls-item logout-item" id="menuLogout" role="menuitem">
          <svg class="item-icon" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20">
            <path
              d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z" />
          </svg>
          <span class="item-label">登出</span>
        </button>
      </div>
    </div>
    <button id="signInBtn" class="sign-in-button">
      <svg class="g-logo" width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
          fill="#4285F4"></path>
        <path
          d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z"
          fill="#34A853"></path>
        <path
          d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.547 0 9c0 1.453.347 2.827.957 4.042l3.007-2.332z"
          fill="#FBBC05"></path>
        <path
          d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z"
          fill="#EA4335"></path>
      </svg>
      <span>使用 Google 帳戶登入</span>
    </button>
    <div class="start-title">題矣</div>
    <div class="header-right-homepage">
    </div>

    <!-- Main Content Area -->
    <main class="home-content">
      <nav class="library-shortcuts" aria-label="學習紀錄">
        <button id="homeMistakes" class="quiet-button">錯題本 <span aria-hidden="true">↗</span></button>
        <button id="homeStarred" class="quiet-button">已收藏 <span aria-hidden="true">↗</span></button>
      </nav>
      <div id="continue-section" style="display:none;">
        <div class="section-header">
          <h2 class="section-title">繼續</h2>
        </div>
        <div id="continue-card" class="continue-card">
          <div class="continue-details">
            <h3 id="continue-title-text" class="continue-title-text">題庫名稱</h3>
            <div class="continue-progress-track">
              <div id="continue-progress-fill" class="continue-progress-fill"></div>
            </div>
            <p id="continue-stats-text" class="continue-stats-text">0/0 題</p>
          </div>
          <button id="continue-btn-action" class="continue-btn-action">繼續</button>
        </div>
      </div>

      <div class="section-header">
        <h2 class="section-title">題庫</h2>
        <input id="bankSearch" class="library-search" type="search" placeholder="搜尋目前列表" aria-label="搜尋目前列表">
      </div>

      <!-- Folder/Unit Navigation logic will render here -->
      <div id="folder-breadcrumb" class="folder-breadcrumb"></div> <!-- Replaces folder-toolbar -->
      <div id="units-grid" class="units-grid"><p class="empty-state" role="status">載入題庫中…</p></div> <!-- Replaces button-row -->
    </main>

    <!-- Hidden legacy elements if needed for script compatibility before full refactor -->
    <div id="folder-toolbar" style="display:none;"></div>
    <div id="button-row" style="display:none;"></div>
    <button id="startGame" style="display:none;">Start</button>
    <button id="restore" style="display:none;"></button>
  </div>

  <!-- 測驗內容 -->
  <div class="quiz-container">
    <div class="header">
      <div class="quiz-title">題矣</div>
      <div class="header-right">
        <button id="starQuestion" class="header-icon-btn star-btn" aria-label="收藏題目">
          <svg class="star-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24">
            <path class="star-fill" d="m233-120 65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149Z" />
            <path class="star-outline"
              d="m354-287 126-76 126 77-33-144 111-96-146-13-58-136-58 135-146 13 111 97-33 143ZM233-120l65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Zm247-350Z" />
          </svg>
        </button>
        <div id="quizTimer" class="timer-display" style="display:none;"></div>
      </div>
    </div>
    <!-- Progress Display -->
    <div class="progress-container">
      <div class="progress-counts">
        <div class="progress-count">
          <span class="count-text">答對</span>
          <span class="count-number" id="correct">0</span>
        </div>
        <div class="progress-count">
          <span class="count-number" id="wrong">0</span>
          <span class="count-text">答錯</span>
        </div>
      </div>
      <div id="progressDots" class="progress-dots"></div>
    </div>
    <div class="question-content" id="question"></div>
    <div class="fillblank-container" style="display: none;">
      <input type="text" id="fillblank-input" class="fillblank-input" placeholder="請輸入完整句子，系統將自動驗證關鍵字">
    </div>
    <div class="options" id="options"></div>
    <button id="confirm-btn" class="confirm-button">確認</button>
    <button id="back-progress-btn" class="back-progress-button" style="display: none;">回當前進度</button>

    <div class="explanation" id="explanation">
      <div class="explanation-text" id="explanation-text"></div>
      <div id="origin-display" class="origin-display"></div>
      <div id="WeeGPTInputSection" style="display: none;">
        <div class="chat-input-wrapper">
          <input id="userQuestion" type="text" placeholder="詢問 Gemini..." autocomplete="off">
          <button id="sendQuestionBtn" class="chat-send-btn" aria-label="傳送">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </div>
      </div>
      <div class="explanation-buttons">
        <div class="header-right">
          <button id="copy-btn" class="action-icon-btn" aria-label="複製題目">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path
                d="M360-240q-33 0-56.5-23.5T280-320v-480q0-33 23.5-56.5T360-880h360q33 0 56.5 23.5T800-800v480q0 33-23.5 56.5T720-240H360Zm0-80h360v-480H360v480ZM200-80q-33 0-56.5-23.5T120-160v-560h80v560h440v80H200Zm160-240v-480 480Z" />
            </svg>
          </button>
          <button id="WeeGPT" class="action-icon-btn gemini-btn" aria-label="詢問 Gemini">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22C12 16.5 8 12 2 12C8 12 12 7.5 12 2C12 7.5 16 12 22 12C16 12 12 16.5 12 22Z" />
            </svg>
          </button>
          <button id="errata-btn" class="action-icon-btn" aria-label="勘誤題目">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
              <path
                d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z" />
            </svg>
          </button>
        </div>
        <button id="next-btn" class="next-button">下一題</button>
        <button id="back-progress-btn-expl" class="back-progress-button" style="display: none;">回當前進度</button>
      </div>
    </div>
    <!-- <div class="copyright">
      © 2025 <a href="https://instagram.com/jedieason" target="_blank">Jedieason</a> 版權所有
    </div> -->
  </div>

  <!-- 自訂模態窗口 Notification Bar -->
  <div id="customAlert" class="notification-bar" role="status" aria-live="polite">
    <div class="notification-content">
      <span id="modal-message">請選擇題庫</span>
    </div>
    <button id="modalConfirmBtn" class="notification-close" aria-label="關閉視窗">&times;</button>
  </div>

  <!-- Starred Questions Modal -->
  <div id="starredModal" class="modal">
    <div class="modal-content starred-modal-content">
      <button class="dialog-close modal-close" aria-label="關閉收藏">&times;</button>
      <h3>已收藏的題目</h3>
      <div id="starredList"></div>
    </div>
  </div>

  <!-- Errata Modal (Material 3) -->
  <div id="errataModal" class="md3-modal-overlay" style="display: none;">
    <div class="md3-dialog">
      <div class="md3-dialog-header">
        <h3 class="md3-dialog-title">勘誤題目答案</h3>
        <button class="dialog-close modal-close" id="errataCloseBtn" aria-label="關閉視窗">
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
            <path
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>
      <div class="md3-dialog-body">
        <p style="font-size: 0.95rem; color: #5f6368; margin: 0 0 -8px 0;">請選擇或輸入正確答案：</p>
        <div id="errataFormContainer"></div>
      </div>
      <div class="md3-dialog-actions">
        <button class="md3-text-btn" id="errataCancelBtn">取消</button>
        <button class="md3-filled-btn" id="errataSaveBtn">儲存</button>
      </div>
    </div>
  </div>

  <!-- Mistake notebook: all controls stay outside the answering interface. -->
  <section id="mistakeView" class="full-screen-view" role="dialog" aria-modal="true" aria-labelledby="mistakeViewTitle">
    <header class="notebook-header">
      <div class="notebook-heading"><h2 id="mistakeViewTitle">錯題本</h2><span>複習紀錄</span></div>
      <button id="closeMistakeViewBtn" class="quiet-button" aria-label="關閉錯題本">關閉</button>
    </header>
    <div class="notebook-controls">
      <div class="notebook-toolbar">
        <div class="notebook-tabs" role="group" aria-label="複習狀態">
          <button data-mistake-status="active" aria-pressed="true">待複習</button>
          <button data-mistake-status="mastered" aria-pressed="false">已熟悉</button>
          <button data-mistake-status="all" aria-pressed="false">全部</button>
        </div>
        <input id="mistakeSearch" type="search" placeholder="搜尋題目、出處或關鍵字" aria-label="搜尋錯題">
      </div>
      <div class="notebook-filters">
        <select id="mistakeSubject" aria-label="篩選科目"><option value="">全部科目</option></select>
        <select id="mistakeQuiz" aria-label="篩選題庫"><option value="">全部題庫</option></select>
        <select id="mistakeSort" aria-label="排序錯題"><option value="recent">最近答錯</option><option value="frequent">錯誤最多</option><option value="oldest">最久未回顧</option></select>
      </div>
      <p id="mistakeSummary" class="notebook-summary" role="status"></p>
    </div>
    <div id="mistakeScrollContainer" class="notebook-scroll"><div id="mistakeListContent"></div></div>
    <footer class="notebook-bottom">
      <label class="notebook-select-all"><input id="mistakeSelectAll" type="checkbox">全選</label>
      <span id="mistakeSelection" role="status"></span>
      <button id="mistakeClearSelection" class="quiet-button" hidden>取消選取</button>
      <button id="mistakePracticeBtn" class="primary-button">開始複習</button>
    </footer>
  </section>
<!-- Upload Quiz Modal (Material 3) -->
<div id="uploadModal" class="md3-modal-overlay">
  <div class="md3-dialog">
    <div class="md3-dialog-header">
      <h3 class="md3-dialog-title">新增題庫</h3>
      <button class="dialog-close modal-close" aria-label="關閉視窗">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>

    <div class="md3-dialog-body">
      <!-- Segmented Button for Mode Switch -->
      <div class="md3-segmented-btn-group">
        <label class="md3-segmented-btn">
          <input type="radio" name="upload-mode" value="paste" checked>
          <span>貼上 JSON</span>
        </label>
        <label class="md3-segmented-btn">
          <input type="radio" name="upload-mode" value="file">
          <span>上傳檔案</span>
        </label>
      </div>

      <!-- Helper Text or Instructions can go here -->

      <!-- Name Input -->
      <div class="md3-input-wrapper">
        <input type="text" id="uploadNameInput" class="md3-input" placeholder=" ">
        <label for="uploadNameInput" id="uploadNameLabel" class="md3-floating-label">題庫名稱</label>
      </div>

      <!-- Paste Area -->
      <div id="pasteSection" class="input-section">
        <div class="md3-input-wrapper textarea-wrapper">
          <textarea id="pasteJson" class="md3-textarea" placeholder=" "></textarea>
          <label for="pasteJson" class="md3-floating-label">JSON 內容</label>
        </div>
      </div>

      <!-- Drop Zone -->
      <div id="fileDropZone" class="file-drop-zone" style="display:none;">
        <input type="file" id="uploadJson" accept=".json" multiple hidden>
        <div class="drop-zone-content">
          <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" height="48" viewBox="0 0 24 24" width="48"
            fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
          </svg>
          <p id="dropZoneLabel">點擊或拖曳 JSON 檔案至此 (支援多選)</p>
        </div>
        <div id="fileSelectedList" class="file-selected-list" style="display:none;"></div>
      </div>
    </div>

    <div class="md3-dialog-actions">
      <button class="md3-text-btn modal-close">取消</button>
      <button id="uploadConfirmBtn" class="md3-filled-btn">建立</button>
    </div>
  </div>
</div>

<!-- Archive Confirm Modal (Material 3) -->
<div id="archiveConfirmModal" class="md3-modal-overlay" style="display: none;">
  <div class="md3-dialog">
    <div class="md3-dialog-header">
      <h3 class="md3-dialog-title" id="archiveConfirmTitle">典藏題庫</h3>
    </div>
    <div class="md3-dialog-body" style="padding-top: 10px;">
      <p id="archiveConfirmMessage" style="margin: 0; font-size: 1rem; color: #444746;">確定要典藏這份題庫嗎？</p>
    </div>
    <div class="md3-dialog-actions" style="margin-top: 24px;">
      <button class="md3-text-btn" id="archiveCancelBtn">取消</button>
      <button class="md3-filled-btn" id="archiveActionBtn">確認</button>
    </div>
  </div>
</div>

<!-- Quiz entry shares the same dialog shell as editing tools. -->
<div id="quizActionModal" class="md3-modal-overlay" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="quizActionTitle">
  <div class="md3-dialog quiz-entry-dialog">
    <button class="dialog-close modal-close" id="quizActionCloseBtn" aria-label="關閉視窗">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg>
    </button>
    <div class="quiz-entry-heading">
      <p id="quizActionSubject" class="dialog-eyebrow"></p>
      <h3 id="quizActionTitle">題庫名稱</h3>
    </div>
    <div class="quiz-entry-progress">
      <div class="quiz-entry-progress-label"><span id="quizActionStatus"></span><span id="quizActionCount"></span></div>
      <div id="quizActionTrack" class="quiz-entry-track"><div id="quizActionFill"></div></div>
      <p id="quizActionOrder" class="quiz-entry-order"></p>
    </div>
    <div class="quiz-action-options">
      <button id="quizActionResumeBtn" class="primary-button"><span>繼續測驗</span><span aria-hidden="true">→</span></button>
      <button id="quizActionRestartBtn" class="primary-button"><span>開始測驗</span><span aria-hidden="true">→</span></button>
    </div>
  </div>
</div>
